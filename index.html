<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antikythera Mk III: The Engine & Planet Mode</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 m-0 p-0 overflow-hidden font-sans select-none">
    <div id="app" class="w-screen h-screen flex flex-col overflow-hidden">
      <!-- PERSISTENT PLANET BAR (TOP 9-WORLD NAVIGATION & MODE SELECTION) -->
      <header id="planet-bar-container" class="w-full shrink-0 z-40 bg-slate-950 shadow-md"></header>

      <!-- MAIN APP WORKSPACE (3D DISPLAY & CONTROL DASHBOARD) -->
      <div class="flex-1 w-full flex flex-col lg:flex-row overflow-hidden relative">
        <!-- 3D DISPLAY AREA (MECHANISM & STANDING SKY WINDOW) -->
        <main id="canvas-container" class="relative flex-1 h-[50vh] lg:h-full bg-slate-950 overflow-hidden flex">
          
          <!-- Viewport Floating HUD Controls (Center & Fit, Zoom, Angles) -->
          <div class="absolute top-3 left-3 z-30 flex items-center gap-1.5 bg-slate-950/85 p-1.5 rounded-lg border border-slate-800/80 backdrop-blur-sm shadow-2xl">
            <button id="btn-zoom-in" class="w-8 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-lg active:scale-95 transition-transform" title="Zoom In">+</button>
            <button id="btn-zoom-out" class="w-8 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-lg active:scale-95 transition-transform" title="Zoom Out">−</button>
            <button id="btn-fit-frame" class="px-2.5 h-8 flex items-center justify-center rounded bg-amber-600 hover:bg-amber-500 text-slate-950 text-xs font-mono font-bold active:scale-95 transition-transform shadow" title="Center & Fit Mechanism in Screen">Center & Fit</button>
            <div class="w-px h-5 bg-slate-800 mx-0.5"></div>
            <button id="btn-hud-front" class="px-2 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-mono active:scale-95 transition-transform" title="Front Dial View">Front</button>
            <button id="btn-hud-back" class="px-2 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-mono active:scale-95 transition-transform" title="Back Dial View">Back</button>
            <button id="btn-hud-clepsydra" class="px-2 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-cyan-300 text-xs font-mono active:scale-95 transition-transform" title="Clepsydra Water Drive">Water</button>
            <button id="btn-hud-sky" class="px-2 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-sky-300 text-xs font-mono active:scale-95 transition-transform" title="Anaphoric Star Plate">Plate</button>
            <button id="btn-hud-drum" class="px-2 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-mono active:scale-95 transition-transform" title="Programmable Pin Drum">Drum</button>
            <button id="btn-hud-compute" class="px-2 h-8 flex items-center justify-center rounded bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs font-mono active:scale-95 transition-transform" title="Compute Bay">Compute</button>
          </div>

          <!-- Mechanism 3D Canvas -->
          <div id="viewport-mechanism" class="absolute inset-0 w-full h-full"></div>

          <!-- Standing Sky Window (Inset Mode by default) -->
          <div id="viewport-sky" class="absolute top-4 right-4 w-72 h-72 rounded-xl overflow-hidden border-2 border-slate-700 shadow-2xl z-20 transition-all duration-300"></div>
        </main>

        <!-- INTERACTIVE CONTROL DASHBOARD -->
        <aside id="dashboard-container" class="w-full lg:w-[500px] xl:w-[560px] h-[50vh] lg:h-full bg-slate-900 border-t lg:border-t-0 lg:border-l border-slate-800 flex flex-col shrink-0 overflow-hidden shadow-2xl z-30">
        </aside>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
